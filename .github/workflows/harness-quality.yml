name: harness-quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"

      - name: Run harness regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile distributed Python
        run: >-
          python -m compileall -q bootstrap.py template/.claude/hooks template/scripts
          plugin/python-engineering-harness/scripts

      - name: Lint harness distribution
        run: >-
          uvx --from ruff==0.15.20 ruff check --isolated bootstrap.py tests
          template/.claude/hooks template/scripts plugin/python-engineering-harness/scripts

      - name: Validate workflow syntax
        run: node --check template/.claude/workflows/review-branch.js

      - name: Reject whitespace errors
        run: git diff --check
